name: Go build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/aru-ai-chatbot]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc g++ make binutils zlib1g-dev libssl-dev pkg-config
      - name: Resolve and verify module checksums
        run: go mod tidy
      - name: Install ntgcalls native library
        run: go run setup_ntgcalls.go
      - name: Build
        run: CGO_ENABLED=1 go build ./...
      - name: Test
        run: CGO_ENABLED=1 go test ./...
