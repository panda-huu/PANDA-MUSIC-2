name: Go build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/aru-ai-chatbot]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve and verify module checksums
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
